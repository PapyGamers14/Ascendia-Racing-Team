<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Motif inspiré de la combinaison Ascendia Racing (sans sponsors ni logo) -->
  <rect width="1600" height="1000" fill="#163c4c"/>

  <!-- panneaux noirs latéraux -->
  <polygon points="0,0 250,0 110,1000 0,1000" fill="#0b1114"/>
  <polygon points="1600,0 1600,1000 1400,1000 1490,0" fill="#0b1114"/>
  <polygon points="700,0 900,0 830,170 770,170" fill="#0b1114"/>

  <!-- éclats côté gauche -->
  <polygon points="250,0 520,0 330,420" fill="#255f75"/>
  <polygon points="330,420 520,0 610,250" fill="#4ea8bd"/>
  <polygon points="520,0 700,0 610,250" fill="#2f7890"/>
  <polygon points="110,1000 330,420 420,1000" fill="#1f5367"/>
  <polygon points="330,420 420,1000 560,760" fill="#9ccfd9"/>
  <polygon points="330,420 560,760 610,250" fill="#306f86"/>
  <polygon points="420,1000 560,760 640,1000" fill="#c3cfd3"/>

  <!-- éclats côté droit -->
  <polygon points="1490,0 1100,0 1270,380" fill="#255f75"/>
  <polygon points="1270,380 1100,0 990,250" fill="#c3cfd3"/>
  <polygon points="1100,0 900,0 990,250" fill="#2f7890"/>
  <polygon points="1400,1000 1270,380 1180,1000" fill="#1f5367"/>
  <polygon points="1270,380 1180,1000 1040,760" fill="#4ea8bd"/>
  <polygon points="1270,380 1040,760 990,250" fill="#123241"/>
  <polygon points="1180,1000 1040,760 960,1000" fill="#9ccfd9"/>

  <!-- chevrons en V du torse -->
  <polygon points="560,300 800,560 1040,300 1040,380 800,650 560,380" fill="#4ea8bd"/>
  <polygon points="610,450 800,660 990,450 990,505 800,725 610,505" fill="#c3cfd3"/>
  <polygon points="520,600 800,900 1080,600 1080,665 800,975 520,665" fill="#7cc4d3"/>
  <polygon points="700,170 800,300 900,170 900,215 800,350 700,215" fill="#0b1114"/>

  <!-- liserés blancs le long des panneaux -->
  <g fill="none" stroke="#dce7ea" stroke-width="5" stroke-linecap="square">
    <line x1="250" y1="0" x2="110" y2="1000"/>
    <line x1="1490" y1="0" x2="1400" y2="1000"/>
  </g>
</svg>
